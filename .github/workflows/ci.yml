name: CI

# Why: A build-breaking TypeScript error (e.g. the May 28 TS2322) can pass code
# review and silently fail every Vercel deploy for days, freezing the scraper cron.
# `tsc --noEmit` catches that regression class.
# What: Under the fleet CI ruling (Actions for release builds only), this workflow
# is the release-build check: it runs on pushed `v*` tags and on manual dispatch.
# PR and push checks run on the developer's host through the local gate,
# scripts/local-gate.mjs (`npm run gate:local`), which posts an informational
# `local-gate` commit status.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci installs exactly from package-lock.json for reproducible builds.
      - name: Install dependencies
        run: npm ci

      # Fails the job (non-zero exit) on any type error.
      - name: Type check
        run: npx tsc --noEmit

  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci installs exactly from package-lock.json for reproducible builds.
      - name: Install dependencies
        run: npm ci

      # Runs the vitest unit suite (vitest run) and fails the job on any failure.
      # Playwright e2e specs are excluded by vitest.config.ts.
      - name: Unit tests
        run: npm run test:unit
