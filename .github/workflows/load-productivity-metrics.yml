name: Load productivity metrics (#314)

# #314: dispatch-only apply workflow for the reviewed productivity-tool metrics (D80), in the
# pattern of load-model-metrics.yml.
#
# Why: D80 writes the figures in docs/refresh/productivity-metrics.json (tracked) into the nine
# rows migration 0027 created. D69: this load and migration 0033 ship in the same release step.
#
# What: a manual dispatch over scripts/load-productivity-metrics.ts with the tracked file. Every
# run starts with the script's dry run (exit 1 on an invalid file or a refused row). The default
# inputs stop there and write nothing. A write needs `dry_run: false` and
# `confirm: load-productivity-metrics`; it runs one transaction, only after the dry run succeeded,
# and only from main. The script never changes a row's status: the rows stay inactive until 0033.
# The summary carries the mode, each step's outcome and the totals line only (D19).
#
# Sequencing (D69): dispatch the write, then apply 0033 with apply-migration.yml in the Dd3
# window, then the per-list publish. 0033 activates seven rows; gemini-app and mistral-vibe keep
# their metrics and stay inactive.
#
# Recovery (D98): before a write dispatch, the owner creates a named Neon branch of production
# (name pattern: pre-productivity-metrics-YYYYMMDD) and records its name and UTC time. Rollback
# is a restore from that branch.
#
# Test: tests/unit/productivity-metrics-workflow-314.test.ts.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only: print the per-tool diff, write nothing. Leave true for the first run.'
        type: boolean
        default: true
        required: false
      confirm:
        description: 'Write only: load-productivity-metrics. Ignored on a dry run.'
        type: string
        default: ''
        required: false

# Read-only: this workflow writes to the database, never to the repository or its issues.
permissions:
  contents: read

concurrency:
  group: load-productivity-metrics-314
  cancel-in-progress: false

jobs:
  load-productivity-metrics:
    name: Productivity metrics load
    # A dispatch from any ref but main is skipped. Known limit: workflow_dispatch runs the workflow
    # file from the dispatched ref and DATABASE_URL is a repository secret, so any branch can carry
    # a workflow without this guard, whether cut before it or edited to remove it, until
    # DATABASE_URL moves to an environment restricted to main. The guard stops a mistaken apply,
    # not a deliberate one by someone with push access.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Inputs reach the shell only through `env:`. A write needs dry_run exactly "false" and the
      # confirmation; anything else with dry_run false fails the job.
      - name: Select mode
        id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -uo pipefail
          if [ "$DRY_RUN" != "false" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "Mode: dry run (writes nothing)"
            exit 0
          fi
          if [ "$CONFIRM" != "load-productivity-metrics" ]; then
            echo "::error::dry_run is false but confirm is not load-productivity-metrics; nothing was run"
            exit 1
          fi
          echo "mode=apply" >> "$GITHUB_OUTPUT"
          echo "Mode: write metrics"

      # Always runs, so a write is preceded by a fresh plan; exit 1 stops the job.
      - name: Dry run (writes nothing)
        id: dryrun
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -uo pipefail
          status=0
          npx tsx scripts/load-productivity-metrics.ts --dry-run > "$RUNNER_TEMP/dry-run.raw" 2>&1 || status=$?
          grep -v -E '^using [A-Z_]+ \(NODE_ENV=' "$RUNNER_TEMP/dry-run.raw" > "$RUNNER_TEMP/dry-run.txt" || [ "$?" -eq 1 ] || exit 2
          rm -f "$RUNNER_TEMP/dry-run.raw"
          cat "$RUNNER_TEMP/dry-run.txt"
          grep -E '^totals: ' "$RUNNER_TEMP/dry-run.txt" > "$RUNNER_TEMP/counts-dry-run.txt" || [ "$?" -eq 1 ] || exit 2
          exit "$status"

      # One transaction, run only after the dry run succeeded. A re-run is a no-op.
      - name: Write metrics
        id: write
        if: ${{ success() && steps.mode.outputs.mode == 'apply' && steps.dryrun.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -uo pipefail
          status=0
          npx tsx scripts/load-productivity-metrics.ts --apply > "$RUNNER_TEMP/write.raw" 2>&1 || status=$?
          grep -v -E '^using [A-Z_]+ \(NODE_ENV=' "$RUNNER_TEMP/write.raw" > "$RUNNER_TEMP/write.txt" || [ "$?" -eq 1 ] || exit 2
          rm -f "$RUNNER_TEMP/write.raw"
          cat "$RUNNER_TEMP/write.txt"
          grep -E '^(totals: |apply: committed)' "$RUNNER_TEMP/write.txt" > "$RUNNER_TEMP/counts-write.txt" || [ "$?" -eq 1 ] || exit 2
          exit "$status"

      # Counts only (D19). Runs on failure too; it never changes the job result.
      - name: Job summary
        id: summary
        if: ${{ always() }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DRY_RUN_OUTCOME: ${{ steps.dryrun.outcome }}
          WRITE_OUTCOME: ${{ steps.write.outcome }}
        run: |
          set -uo pipefail
          case "${MODE:-}" in
            apply) mode_label='write metrics' ;;
            dry-run) mode_label='dry run (nothing written)' ;;
            *) mode_label='refused (inputs failed validation, nothing run)' ;;
          esac
          {
            echo '## Productivity metrics load'
            echo ''
            echo "- Mode: ${mode_label}"
            echo "- Dry run: ${DRY_RUN_OUTCOME:-not run}"
            echo "- Write: ${WRITE_OUTCOME:-not run}"
            echo ''
            echo '### Counts'
            echo ''
            echo '```'
            for part in dry-run write; do
              if [ -s "$RUNNER_TEMP/counts-${part}.txt" ]; then
                sed "s/^/${part}: /" "$RUNNER_TEMP/counts-${part}.txt"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
