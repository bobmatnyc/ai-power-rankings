name: Secret scan (gitleaks)

# #460: no secret scan ran anywhere, so the 32 hits triaged in #458 went unseen.
# Why: A committed credential must fail the pull request that adds it, before merge.
# What: Runs gitleaks 8.30.1 with the root `.gitleaks.toml` on every pull request to
# main and every push to main. It scans the checked-out working tree and, on a pull
# request, the PR's own commits (base..head). It never scans full history: older
# commits hold triaged hits the path allowlist does not cover (#460 design comment).
# Any finding fails the job. `--redact` keeps secret values out of the log, and no
# report is uploaded.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded PR run; let every push to main finish its own scan.
concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from gitleaks_8.30.1_checksums.txt.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history so the PR base commit is present for the range scan.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned release tarball, checked against a pinned SHA-256 before extraction.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL --proto '=https' -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          mkdir -p gitleaks-bin
          tar -xzf "$tarball" -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

      # The PR's own commits only. SHAs reach the shell through env, not inline.
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
          --log-opts="${BASE_SHA}..${HEAD_SHA}"
