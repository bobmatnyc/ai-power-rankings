name: Generate weekly digest (manual)

# Why: #468: the Monday weekly-digest cron can fail (2026-W47 answered 500,
# draft rejected), and the only re-run path needed a Keychain relay. This
# workflow is the manual re-run.
#
# What: a manual dispatch that sends one authorised GET to the production route
# /api/cron/weekly-digest (app/api/cron/weekly-digest/route.ts).
#   - The route takes no week parameter: it always generates the PREVIOUS full
#     ISO week (UTC) at request time. The `week` input is therefore a check, not
#     a parameter: the job sends nothing unless `week` equals the previous ISO
#     week on the runner clock, and it fails if the response names another week.
#     A missed week can only be re-run until the next Monday 00:00 UTC.
#   - `dry_run` defaults to true and sends `?dry_run=1`: the route aggregates and
#     builds the prompt, then stops (no LLM call, no write). Set it to false to
#     generate and store the digest.
#   - Never sends `force` or any override: a stored week is never replaced. The
#     route answers `skipped` / `already-stored` for a stored week.
#   - The existing CRON_SECRET repository secret reaches the step only through
#     `env:`. curl reads the Authorization header from stdin (`--header @-`), so
#     the secret is never in `run:` text, in the process arguments or in the log.
#   - The response body is printed. It holds the outcome status, week, tier and
#     counts, or the error message; never the digest text.
#   - No automatic retry. `concurrency` with cancel-in-progress false queues a
#     second dispatch behind a running one.
#
# The origin is pinned to https://aipowerranking.com or https://www.aipowerranking.com
# and curl accepts https only (`--proto '=https'`).
#
# Dispatch-only on purpose: it must never run on a schedule, push or pull request.

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week to generate, e.g. 2026-W47. Must be the previous full ISO week (UTC); the route generates no other week.'
        type: string
        required: true
      dry_run:
        description: 'Dry run: report counts, no LLM call, no write. Uncheck to generate and store the digest.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: weekly-digest-dispatch
  cancel-in-progress: false

env:
  # Same origin rule as publish-rankings.yml and lib/site-origin.ts.
  PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://aipowerranking.com' }}
  # The route's maxDuration is 300 s; 10 s more covers connection and transfer.
  DIGEST_TIMEOUT_SECONDS: '310'

jobs:
  digest:
    name: weekly digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The dispatch inputs reach the shell only through `env:`.
      - name: Validate week
        env:
          WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          if [[ ! "$WEEK" =~ ^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$ ]]; then
            echo "::error::week must look like 2026-W47 (YYYY-Www, week 01-53); nothing was sent"
            exit 1
          fi
          # The previous full ISO week is the ISO week of the instant 7 days ago.
          expected=$(date -u -d '7 days ago' +%G-W%V)
          if [ "$WEEK" != "$expected" ]; then
            echo "::error::the route generates only the previous ISO week (${expected} now); ${WEEK} cannot be generated by this workflow; nothing was sent"
            exit 1
          fi
          echo "week ${WEEK} is the previous ISO week"

      # No `set -x` and no curl -v: the header is never printed. printf is a bash
      # builtin, so the secret never appears in any process's argument list.
      - name: Call GET /api/cron/weekly-digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEEK: ${{ inputs.week }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          # Fail closed on any other origin: the secret is never sent elsewhere.
          if [[ ! "$PRODUCTION_BASE_URL" =~ ^https://(www\.)?aipowerranking\.com/?$ ]]; then
            echo "::error::PRODUCTION_BASE_URL is not https://aipowerranking.com; nothing was sent"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is empty or not available to this run; nothing was sent"
            exit 1
          fi

          target="${PRODUCTION_BASE_URL%/}/api/cron/weekly-digest"
          # #468: the only query parameter ever sent is dry_run=1. Never force.
          if [ "$DRY_RUN" = "true" ]; then
            target="${target}?dry_run=1"
          fi
          body="${RUNNER_TEMP}/digest-body.json"
          : > "$body"
          echo "GET ${target} (dry_run=${DRY_RUN}, timeout ${DIGEST_TIMEOUT_SECONDS}s, no retry)"

          http_status=$(printf 'Authorization: Bearer %s\n' "$CRON_SECRET" | curl -sS \
            --proto '=https' \
            --fail-with-body \
            --max-time "${DIGEST_TIMEOUT_SECONDS}" \
            --retry 0 \
            --header @- \
            -o "$body" \
            -w '%{http_code}' \
            "$target") || curl_failed=1
          # `-w` still prints the status when --fail-with-body fails the transfer.
          http_status="${http_status:-000}"

          echo "## Weekly digest ${WEEK}" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP status: ${http_status}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Response body:"
          jq . "$body" 2>/dev/null || cat "$body"
          echo
          {
            echo '```json'
            jq . "$body" 2>/dev/null || cat "$body"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${curl_failed:-0}" = "1" ]; then
            if [ "$http_status" = "401" ]; then
              echo "::error::CRON_SECRET mismatch with production — report to Architect, do not rotate"
            else
              echo "::error::weekly digest request failed (HTTP ${http_status})"
            fi
            rm -f "$body"
            exit 1
          fi

          got_week=$(jq -r '.week // ""' "$body" 2>/dev/null || echo "")
          rm -f "$body"
          if [ "$got_week" != "$WEEK" ]; then
            echo "::error::the route answered for week '${got_week}', not ${WEEK} (the ISO week rolled over during the run?)"
            exit 1
          fi
