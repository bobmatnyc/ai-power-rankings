name: Check metrics history (read-only)

# Why: #95 collects monthly tool metrics into the private tool_metrics_history
# table, one cron invocation per collector shard. A shard that never fired, or
# stopped at its deadline, is visible only in the metrics_collection_runs ledger,
# and nobody can reach the production database from a laptop.
#
# What: runs scripts/check-metrics-history.ts and writes its report to the job
# summary. Scheduled at 06:00 UTC on the 2nd, it checks the current month's
# collection (collected_date YYYY-MM-01 UTC, via --scheduled); a manual dispatch
# checks the `date` input, or today when empty. It writes nothing anywhere:
#   - The script sends four SELECTs inside one READ ONLY Postgres transaction;
#     Postgres rejects any write there. It never calls the cron route or a migration.
#   - The existing repository database secret reaches the step only through `env:`,
#     never through `run:` text, and is never printed.
#   - Script errors are redacted (connection strings and the secret value).
#   - No artifact is uploaded.
#   - #95: the repository is public and the history is private, so the log and the
#     summary carry counts, dates and part names only: rows per collected_date,
#     coverage against the tool count, the ledger status and counts per shard, and
#     unchanged-value counts per part. No tool name, slug, id or metric value.
# Exit 0: pass (WARN lines allowed). Exit 3: a shard is missing or not ok, or a part
# attempted tools and recorded none, or coverage is under a set floor (none is set
# yet: coverage only WARNs). Exit 1: an error, including a failed query.
# Exit 1 and 3 fail the job, and the failed-workflow email is the alert. There is
# no issue, no other channel and no retry.
#
# Never on push or pull request.

on:
  # #95: 06:00 UTC on the 2nd, a day after the last collector shard on the 1st.
  schedule:
    - cron: '0 6 2 * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'collected_date to check, as YYYY-MM-DD. Empty means today (UTC).'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: metrics history ledger
    runs-on: ubuntu-latest
    environment: prod-db
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Fail closed: on a ref without the script (main before #95 merges) this step
      # exits non-zero before any install or database access.
      - name: Require the check script
        run: |
          set -uo pipefail
          for f in scripts/check-metrics-history.ts lib/metrics-history/check-report.ts; do
            if ! test -f "$f"; then
              echo "::error::$f is missing on this ref; dispatch with --ref set to the #95 branch"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The dispatch input reaches the shell only through `env:` and is shape-checked.
      - name: Validate inputs
        env:
          CHECK_DATE: ${{ inputs.date }}
        run: |
          set -uo pipefail
          if [ -n "$CHECK_DATE" ] && [[ ! "$CHECK_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD or empty"
            exit 1
          fi

      # stdout is the counts-only report (or `Result: ERROR`); a fixed error line goes
      # to stderr. NODE_ENV=test keeps the app's connection module from loading dotenv
      # files; LOG_LEVEL=silent turns the app logger off.
      - name: Check (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHECK_DATE: ${{ inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
          NODE_ENV: test
          LOG_LEVEL: silent
        run: |
          set -uo pipefail
          date_flag=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            date_flag=("--scheduled")
          elif [ -n "$CHECK_DATE" ]; then
            date_flag=("--date=${CHECK_DATE}")
          fi
          status=0
          npx tsx scripts/check-metrics-history.ts "${date_flag[@]}" > report.txt || status=$?
          # #95: the report (counts and statuses only) also goes to the job log, which
          # the API can read when the summary cannot be. Any other exit writes a fixed line.
          if [ "$status" -eq 0 ] || [ "$status" -eq 3 ]; then
            cat report.txt
            cat report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Result: ERROR (exit ${status})"
            echo "Result: ERROR (exit ${status})" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f report.txt
          exit "$status"
