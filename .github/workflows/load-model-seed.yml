name: Load model seed (#329)

# #329: dispatch-only apply workflow for the reviewed model seeds, in the D96 pattern of
# merge-duplicate-tools.yml.
#
# Why: the model seed rows (docs/refresh/closed-models.json,
# docs/refresh/open-weight-models-refresh.json and docs/refresh/model-majors-seed.json) reach production only through
# scripts/load-model-seeds.ts, and only the DATABASE_URL repository secret reaches production.
#
# What: a manual dispatch over scripts/load-model-seeds.ts. Every run starts with the
# script's dry run, which prints the per-row diff and exits 1 when a row is refused. A
# dispatch with the default inputs stops there and writes nothing. Writing needs
# `dry_run: false` AND `confirm: load-model-seed`; the write step then runs one transaction,
# only after the dry run succeeded. The seed upsert never changes a row's status or metrics.
# `set_status: true` (with seed all) adds the lifecycle status step: the dry run then also plans,
# and the write also sets in the same transaction, each row's status from
# docs/refresh/model-lifecycle.json (active or deprecated, #329), then re-points the listed
# Opus 4.x redirect aliases to claude-opus-4.
#
# Field ownership (#334). On a new row the seed sets every field it states, with status inactive.
# On an existing model row:
# - The seed owns data.modelSeed (its provenance) and replaces it on every write.
# - open_weight is filled when empty; a stored value that disagrees refuses the row, with no override.
# - hf_repo, licence, parameters_b, active_parameters_b and release_date are curated: the seed
#   fills each one only when it is empty, and an equal value is no change. A stored value that
#   differs refuses the row; the dry run names each field with its stored and seed values.
# - The `overwrite` input is the owner's opt-in to replace named curated values: a comma-separated
#   list of slug:column pairs, such as glm:licence. The dry run marks each one "(overwrite)" with
#   its old and new value, and the write still rolls back if that stored value changed since the plan.
# The seed never writes status, name, category or data.metrics on an existing row.
#
# The job runs only when dispatched from main, so no other
# ref reaches the secret-bearing steps. Any non-zero exit fails the job.
# The job summary carries the mode, each step's outcome and the script's totals line only
# (D19): no host, database fingerprint, role name, rank or score. The script redacts anything
# URL-shaped from its errors, and the `using ... database sha256:` line it prints is dropped
# before the output reaches the log. This repository is public.
#
# Recovery (D98): before the write dispatch, the owner creates a named Neon branch of
# production in the Neon console (name pattern: pre-model-seed-YYYYMMDD) and records its name
# and UTC time. The write dispatch never runs before that branch exists. Rollback is a
# restore from that branch.
# Known gap (D99): the dry run uses the same writer DATABASE_URL repository secret, by name.
# Details: docs/deployment/apply-migrations-workflow.md
#
# Test: tests/unit/load-model-seed-workflow-329.test.ts.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Which seed to load: all, closed, open-weight or majors.'
        type: choice
        options:
          - all
          - closed
          - open-weight
          - majors
        default: all
        required: false
      dry_run:
        description: 'Dry run only: print the per-row diff, write nothing. Leave true for the first run.'
        type: boolean
        default: true
        required: false
      set_status:
        description: 'Also plan (and, on a write, set) each row''s lifecycle status from docs/refresh/model-lifecycle.json. Needs seed all.'
        type: boolean
        default: false
        required: false
      overwrite:
        description: 'Optional: curated values the seed may replace, as slug:column pairs separated by commas (for example glm:licence). Empty refuses every such change.'
        type: string
        default: ''
        required: false
      confirm:
        description: 'Write only: type load-model-seed (with dry_run false). Ignored on a dry run.'
        type: string
        default: ''
        required: false

# Read-only: this workflow writes to the database, never to the repository or its issues.
permissions:
  contents: read

# One load at a time; a queued run waits and never cancels a running write.
concurrency:
  group: load-model-seed-329
  cancel-in-progress: false

jobs:
  load-model-seed:
    name: Model seed load
    # Only a dispatch from main runs; a branch's edited copy of this file never gets the secret.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Inputs reach the shell only through `env:`. Only dry_run exactly "false" with the
      # typed confirmation selects the write; dry_run false with any other confirm fails the
      # job rather than quietly running as a dry run. An unknown seed fails the job.
      - name: Select mode
        id: mode
        env:
          SEED: ${{ inputs.seed }}
          SET_STATUS: ${{ inputs.set_status }}
          OVERWRITE: ${{ inputs.overwrite }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -uo pipefail
          case "$SEED" in
            all|closed|open-weight|majors) echo "seed=$SEED" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::seed must be all, closed, open-weight or majors; nothing was run"; exit 1 ;;
          esac
          case "${SET_STATUS:-false}" in
            true)
              if [ "$SEED" != "all" ]; then echo "::error::set_status needs seed all; nothing was run"; exit 1; fi
              echo "set_status=true" >> "$GITHUB_OUTPUT" ;;
            false) echo "set_status=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::set_status must be true or false; nothing was run"; exit 1 ;;
          esac
          # #334: slug:column pairs only, so the value is safe to pass as one argument.
          pair='[a-z0-9][a-z0-9.-]*:(hf_repo|licence|parameters_b|active_parameters_b|release_date)'
          # The whole string is matched, so a newline or carriage return cannot smuggle a second
          # line into $GITHUB_OUTPUT.
          nl=$'\n'
          cr=$'\r'
          if [ -n "${OVERWRITE:-}" ] && { [[ "$OVERWRITE" == *"$nl"* || "$OVERWRITE" == *"$cr"* ]] || ! [[ "$OVERWRITE" =~ ^${pair}(,${pair})*$ ]]; }; then
            echo "::error::overwrite must be slug:column pairs separated by commas; nothing was run"
            exit 1
          fi
          echo "overwrite=${OVERWRITE:-}" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" != "false" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "Mode: dry run (writes nothing)"
            exit 0
          fi
          if [ "$CONFIRM" != "load-model-seed" ]; then
            echo "::error::dry_run is false but confirm is not load-model-seed; nothing was run"
            exit 1
          fi
          echo "mode=apply" >> "$GITHUB_OUTPUT"
          echo "Mode: write"

      # Always runs, so a write is preceded by a fresh plan; exit 1 on a refused row stops the
      # job before the write.
      - name: Dry run (writes nothing)
        id: dryrun
        env:
          SEED: ${{ steps.mode.outputs.seed }}
          SET_STATUS: ${{ steps.mode.outputs.set_status }}
          OVERWRITE: ${{ steps.mode.outputs.overwrite }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -uo pipefail
          status=0
          status_flag=""
          if [ "${SET_STATUS:-false}" = "true" ]; then status_flag="--set-status"; fi
          npx tsx scripts/load-model-seeds.ts --seed "$SEED" --dry-run ${status_flag:+"$status_flag"} ${OVERWRITE:+--overwrite} ${OVERWRITE:+"$OVERWRITE"} > "$RUNNER_TEMP/seed-dry-run.raw" 2>&1 || status=$?
          grep -v -E '^using [A-Z_]+ \(NODE_ENV=' "$RUNNER_TEMP/seed-dry-run.raw" > "$RUNNER_TEMP/seed-dry-run.txt" || [ "$?" -eq 1 ] || exit 2
          rm -f "$RUNNER_TEMP/seed-dry-run.raw"
          cat "$RUNNER_TEMP/seed-dry-run.txt"
          grep -E '^(totals|status|redirects): ' "$RUNNER_TEMP/seed-dry-run.txt" > "$RUNNER_TEMP/seed-counts-dry-run.txt" || [ "$?" -eq 1 ] || exit 2
          exit "$status"

      # One transaction, run only after the dry run succeeded. A re-run is a no-op.
      - name: Write seed rows
        id: write
        if: ${{ success() && steps.mode.outputs.mode == 'apply' && steps.dryrun.outcome == 'success' }}
        env:
          SEED: ${{ steps.mode.outputs.seed }}
          SET_STATUS: ${{ steps.mode.outputs.set_status }}
          OVERWRITE: ${{ steps.mode.outputs.overwrite }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -uo pipefail
          status=0
          status_flag=""
          if [ "${SET_STATUS:-false}" = "true" ]; then status_flag="--set-status"; fi
          npx tsx scripts/load-model-seeds.ts --seed "$SEED" --apply ${status_flag:+"$status_flag"} ${OVERWRITE:+--overwrite} ${OVERWRITE:+"$OVERWRITE"} > "$RUNNER_TEMP/seed-write.raw" 2>&1 || status=$?
          grep -v -E '^using [A-Z_]+ \(NODE_ENV=' "$RUNNER_TEMP/seed-write.raw" > "$RUNNER_TEMP/seed-write.txt" || [ "$?" -eq 1 ] || exit 2
          rm -f "$RUNNER_TEMP/seed-write.raw"
          cat "$RUNNER_TEMP/seed-write.txt"
          grep -E '^(totals: |status: |redirects: |apply: committed)' "$RUNNER_TEMP/seed-write.txt" > "$RUNNER_TEMP/seed-counts-write.txt" || [ "$?" -eq 1 ] || exit 2
          exit "$status"

      # Counts only (D19). Runs on failure too, so a failed run still records its mode and
      # outcomes; it never changes the job result.
      - name: Job summary
        id: summary
        if: ${{ always() }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SEED: ${{ steps.mode.outputs.seed }}
          SET_STATUS: ${{ steps.mode.outputs.set_status }}
          OVERWRITE: ${{ steps.mode.outputs.overwrite }}
          DRY_RUN_OUTCOME: ${{ steps.dryrun.outcome }}
          WRITE_OUTCOME: ${{ steps.write.outcome }}
        run: |
          set -uo pipefail
          case "${MODE:-}" in
            apply) mode_label='write' ;;
            dry-run) mode_label='dry run (nothing written)' ;;
            *) mode_label='refused (inputs failed validation, nothing run)' ;;
          esac
          {
            echo '## Model seed load'
            echo ''
            echo "- Seed: ${SEED:-not selected}"
            echo "- Status step: ${SET_STATUS:-not selected}"
            echo "- Overwrite: ${OVERWRITE:-none}"
            echo "- Mode: ${mode_label}"
            echo "- Dry run: ${DRY_RUN_OUTCOME:-not run}"
            echo "- Write: ${WRITE_OUTCOME:-not run}"
            echo ''
            echo '### Counts'
            echo ''
            echo '```'
            for part in dry-run write; do
              if [ -s "$RUNNER_TEMP/seed-counts-${part}.txt" ]; then
                sed "s/^/${part}: /" "$RUNNER_TEMP/seed-counts-${part}.txt"
              fi
            done
            echo '```'
            if [ "${MODE:-}" = 'dry-run' ]; then
              echo ''
              echo "Dry run only. To write, re-dispatch with \`dry_run: false\` and \`confirm: load-model-seed\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
