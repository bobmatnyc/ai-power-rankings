name: Merge duplicate tools (D90)

# D96: dispatch-only apply workflow for D90.
#
# Why: D90 merges seven duplicate tool rows into their #191 redirect targets, and only the
# DATABASE_URL repository secret reaches production (see apply-migration.yml, #134). D96:
# "PM builds a dispatch-only apply workflow".
#
# What: a manual dispatch over scripts/merge-duplicate-tools.ts. Every run starts with the
# script's SELECT-only dry run, which exits 1 on an unresolved pair. A dispatch with the
# default inputs stops there and writes nothing. Applying needs `dry_run: false` AND
# `confirm: merge-d90-duplicates`; it then takes the script's backup and runs the apply
# against that backup only when the backup step succeeded. The job runs only when
# dispatched from main, so no other ref reaches the secret-bearing steps. Any non-zero exit fails the job.
# The job summary carries the mode, each step's outcome and the script's count lines only
# (D19): no host, database fingerprint, role name, rank or score. The script redacts
# anything URL-shaped from its errors, and the `using ... database sha256:` line it prints
# is dropped before the output reaches the log. This repository is public.
#
# The backup file lives only for the job, on the runner; it is not a restore path.
# Recovery (D98): before the apply dispatch, the owner creates a named Neon branch of
# production in the Neon console (name pattern: pre-d90-YYYYMMDD) and records its name and
# UTC time. The apply dispatch never runs before that branch exists. Rollback is a restore
# from that branch; a DELETE alone is not a rollback.
# Known gap (D99): the dry run and the backup use the same writer DATABASE_URL repository
# secret, by name. There is no read-only role.
# Details: docs/deployment/apply-migrations-workflow.md
#
# Test: tests/unit/merge-duplicate-tools-workflow-d96.test.ts.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only: print the merge plan, write nothing. Leave true for the first run.'
        type: boolean
        default: true
        required: false
      confirm:
        description: 'Apply only: type merge-d90-duplicates (with dry_run false). Ignored on a dry run.'
        type: string
        default: ''
        required: false

# Read-only: this workflow writes to the database, never to the repository or its issues.
permissions:
  contents: read

# One merge at a time; a queued run waits and never cancels a running apply.
concurrency:
  group: merge-duplicate-tools-d90
  cancel-in-progress: false

jobs:
  merge-duplicate-tools:
    name: D90 duplicate-tool merge
    # Only a dispatch from main runs; a branch's edited copy of this file never gets the secret.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod-db
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Inputs reach the shell only through `env:`. Only dry_run exactly "false" with the
      # typed confirmation selects apply; dry_run false with any other confirm fails the job
      # rather than quietly running as a dry run.
      - name: Select mode
        id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -uo pipefail
          if [ "$DRY_RUN" != "false" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "Mode: dry run (writes nothing)"
            exit 0
          fi
          if [ "$CONFIRM" != "merge-d90-duplicates" ]; then
            echo "::error::dry_run is false but confirm is not merge-d90-duplicates; nothing was run"
            exit 1
          fi
          echo "mode=apply" >> "$GITHUB_OUTPUT"
          echo "Mode: apply"

      # Always runs, so an apply is preceded by a fresh plan; exit 1 on an unresolved pair
      # stops the job before the backup and the apply.
      - name: Dry run (writes nothing)
        id: dryrun
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -uo pipefail
          status=0
          npx tsx scripts/merge-duplicate-tools.ts --dry-run > "$RUNNER_TEMP/d90-dry-run.raw" 2>&1 || status=$?
          grep -v -E '^using [A-Z_]+ \(NODE_ENV=' "$RUNNER_TEMP/d90-dry-run.raw" > "$RUNNER_TEMP/d90-dry-run.txt" || [ "$?" -eq 1 ] || exit 2
          rm -f "$RUNNER_TEMP/d90-dry-run.raw"
          cat "$RUNNER_TEMP/d90-dry-run.txt"
          grep -E '^totals: ' "$RUNNER_TEMP/d90-dry-run.txt" > "$RUNNER_TEMP/d90-counts-dry-run.txt" || [ "$?" -eq 1 ] || exit 2
          exit "$status"

      # The script refuses to apply without a fresh backup of the same database; this step
      # also fails when it exits 0 but leaves no backup file.
      - name: Back up affected rows
        id: backup
        if: ${{ success() && steps.mode.outputs.mode == 'apply' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -uo pipefail
          status=0
          npx tsx scripts/merge-duplicate-tools.ts --backup "$RUNNER_TEMP/d90-backup.json" > "$RUNNER_TEMP/d90-backup.raw" 2>&1 || status=$?
          grep -v -E '^using [A-Z_]+ \(NODE_ENV=' "$RUNNER_TEMP/d90-backup.raw" > "$RUNNER_TEMP/d90-backup.txt" || [ "$?" -eq 1 ] || exit 2
          rm -f "$RUNNER_TEMP/d90-backup.raw"
          cat "$RUNNER_TEMP/d90-backup.txt"
          grep -E '^backup: wrote ' "$RUNNER_TEMP/d90-backup.txt" > "$RUNNER_TEMP/d90-backup-lines.txt" || [ "$?" -eq 1 ] || exit 2
          sed -E 's/^backup: wrote [^:]+: //' "$RUNNER_TEMP/d90-backup-lines.txt" > "$RUNNER_TEMP/d90-counts-backup.txt" || exit 2
          if [ "$status" -eq 0 ] && [ ! -s "$RUNNER_TEMP/d90-backup.json" ]; then
            echo "::error::the backup step exited 0 but wrote no backup file; nothing was applied"
            status=1
          fi
          exit "$status"

      # One transaction, run only after the backup step succeeded. A re-run is a no-op.
      - name: Apply merge
        id: apply
        if: ${{ success() && steps.mode.outputs.mode == 'apply' && steps.backup.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: |
          set -uo pipefail
          status=0
          npx tsx scripts/merge-duplicate-tools.ts --apply "$RUNNER_TEMP/d90-backup.json" > "$RUNNER_TEMP/d90-apply.raw" 2>&1 || status=$?
          grep -v -E '^using [A-Z_]+ \(NODE_ENV=' "$RUNNER_TEMP/d90-apply.raw" > "$RUNNER_TEMP/d90-apply.txt" || [ "$?" -eq 1 ] || exit 2
          rm -f "$RUNNER_TEMP/d90-apply.raw"
          cat "$RUNNER_TEMP/d90-apply.txt"
          grep -E '^(totals: |.*apply: committed)' "$RUNNER_TEMP/d90-apply.txt" > "$RUNNER_TEMP/d90-counts-apply.txt" || [ "$?" -eq 1 ] || exit 2
          exit "$status"

      # Counts only (D19). Runs on failure too, so a failed run still records its mode and
      # outcomes; it never changes the job result.
      - name: Job summary
        id: summary
        if: ${{ always() }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DRY_RUN_OUTCOME: ${{ steps.dryrun.outcome }}
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -uo pipefail
          case "${MODE:-}" in
            apply) mode_label='apply' ;;
            dry-run) mode_label='dry run (nothing written)' ;;
            *) mode_label='refused (inputs failed validation, nothing run)' ;;
          esac
          {
            echo '## D90 duplicate-tool merge'
            echo ''
            echo "- Mode: ${mode_label}"
            echo "- Dry run: ${DRY_RUN_OUTCOME:-not run}"
            echo "- Backup: ${BACKUP_OUTCOME:-not run}"
            echo "- Apply: ${APPLY_OUTCOME:-not run}"
            echo ''
            echo '### Counts'
            echo ''
            echo '```'
            for part in dry-run backup apply; do
              if [ -s "$RUNNER_TEMP/d90-counts-${part}.txt" ]; then
                sed "s/^/${part}: /" "$RUNNER_TEMP/d90-counts-${part}.txt"
              fi
            done
            echo '```'
            if [ "${MODE:-}" = 'dry-run' ]; then
              echo ''
              echo "Dry run only. To apply, re-dispatch with \`dry_run: false\` and \`confirm: merge-d90-duplicates\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
